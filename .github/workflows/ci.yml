name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --project backend --extra dev --locked
      - name: Lint backend
        run: uv run --project backend pylint backend/llm backend/routes backend/scraping backend/latex
      - name: Test backend
        run: >-
          uv run --project backend pytest backend/tests
          --cov=backend --cov-config=backend/pyproject.toml
          --cov-report=term-missing --cov-fail-under=90

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Test frontend
        working-directory: frontend
        run: npm run test:ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
