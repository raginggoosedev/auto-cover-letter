[project]
name = "auto-cover-letter-backend"
version = "1.0.0"
authors = [
    { name = "Michael Quick" },
    { name = "Josh Muszka" },
    { name = "Nicholas Woo" },
]
description = "Flask API for the Auto Cover Letter hackathon project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "flask>=3.1.0",
    "flask-cors>=5.0.1",
    "openai>=1.69.0",
    "pylint>=3.3.6",
    "pypdf>=6.6.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.pylint.main]
py-version = "3.11"
ignore-paths = ["^backend/tests/"]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
omit = ["backend/tests/*"]
